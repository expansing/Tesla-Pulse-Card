name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HACS metadata
        run: |
          set -e
          test -f hacs.json
          test -f dist/tesla-pulse-card.js
          test -f VERSION
          test -f CHANGELOG.md
          jq -e '.name and .filename and (.render_readme == true) and (.content_in_root == false)' hacs.json > /dev/null
          FILENAME="$(jq -r '.filename' hacs.json)"
          test -f "$FILENAME" || (echo "File not found: $FILENAME"; exit 1)

      - name: Validate VERSION and changelog
        run: |
          set -e
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          echo "$VERSION_VALUE" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          grep -F "## [$VERSION_VALUE]" CHANGELOG.md

      - name: Validate JavaScript syntax
        run: node --check dist/tesla-pulse-card.js