name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (defaults to v plus VERSION)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v$(tr -d '[:space:]' < VERSION)}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate tag format
        run: |
          echo "${{ steps.vars.outputs.tag }}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Validate VERSION matches tag
        id: version
        run: |
          set -e
          TAG_VERSION="${{ steps.vars.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$TAG_VERSION" = "$FILE_VERSION"
          echo "value=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes from changelog
        run: |
          set -e
          VERSION_VALUE="${{ steps.version.outputs.value }}"
          awk -v version="$VERSION_VALUE" '
            BEGIN { section=0 }
            $0 ~ "^## \\[[^]]+\\]" {
              if ($0 == "## [" version "]" || index($0, "## [" version "] -") == 1) {
                section=1
                next
              }
              if (section==1) { section=0 }
            }
            section==1 { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Verify build artifact
        run: |
          test -f tesla-pulse-card.js

      - name: Create release archive
        run: |
          mkdir -p release
          cp tesla-pulse-card.js release/tesla-pulse-card.js
          cp hacs.json release/hacs.json
          cp README.md release/README.md
          cp VERSION release/VERSION
          cp CHANGELOG.md release/CHANGELOG.md
          cd release
          zip -r ../tesla-pulse-card.zip .

      - name: Create release tag when needed
        id: release_tag
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.release_tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            tesla-pulse-card.zip
            tesla-pulse-card.js